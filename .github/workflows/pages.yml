name: Refresh prices and deploy Pages

on:
  push:
    branches: [main]
    paths-ignore: ["client/public/data/latest.json"]
  schedule:
    # Keep the 15-minute cadence clear of the top-of-hour queue.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Collect public price observations
        run: pnpm collect
      - name: Retain public source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pricing-sources
          path: work/provider-evidence
          retention-days: 1
          if-no-files-found: ignore
      - name: Preserve observations and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh observed GPU prices"
            git push origin HEAD:main
          fi
      - run: pnpm build:pages
        env:
          VITE_WATCH_API: ${{ vars.WATCH_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified snapshot and dashboard
        id: deployment
        uses: actions/deploy-pages@v4


  alerts:
    needs: deploy
    if: ${{ vars.WATCH_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deliver price and restock notifications
        run: pnpm exec tsx alerts/dispatch.ts
        env:
          WATCH_API_URL: ${{ vars.WATCH_API_URL }}
          WATCH_VAPID_PUBLIC: ${{ vars.WATCH_VAPID_PUBLIC }}
          WATCH_VAPID_PRIVATE: ${{ secrets.WATCH_VAPID_PRIVATE }}
          WATCH_DISPATCH_TOKEN: ${{ secrets.WATCH_DISPATCH_TOKEN }}
